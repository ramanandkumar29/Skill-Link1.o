# ──────────────────────────────────────────────────────────────────────────────
# LEXI AI — Central Configuration (YAML-driven pipeline config)
# ──────────────────────────────────────────────────────────────────────────────

# ===== Model Configuration =====
model:
  base_name: "unsloth/Meta-Llama-3.1-8B-Instruct-bnb-4bit"
  max_seq_length: 8192
  load_in_4bit: true
  dtype: null  # auto-detect

# ===== LoRA / PEFT Configuration =====
lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0
  bias: "none"
  use_rslora: true
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - embed_tokens
    - lm_head

# ===== Training Configuration =====
training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_ratio: 0.05
  num_train_epochs: 3
  max_steps: 200
  learning_rate: 2.0e-4
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  optim: "adamw_8bit"
  logging_steps: 5
  save_steps: 50
  seed: 3407
  neftune_noise_alpha: 5.0
  packing: false

# ===== ORPO Alignment Configuration =====
orpo:
  beta: 0.1
  learning_rate: 8.0e-6
  max_steps: 80
  max_prompt_length: 1024

# ===== Dataset Configuration =====
dataset:
  sft_file: "data/lexi_cot_sft.jsonl"
  orpo_file: "data/lexi_orpo.jsonl"
  eval_file: "data/lexi_eval.jsonl"
  format: "sharegpt"
  num_generate: 50
  eval_samples: 20

# ===== API Provider Configuration =====
providers:
  groq:
    model: "llama-3.1-70b-versatile"
    fallback_model: "llama-3.1-8b-instant"
    max_tokens: 2048
    temperature: 0.7
    rpm_limit: 30
  gemini:
    model: "gemini-2.0-flash"
    fallback_model: "gemini-1.5-flash"
    max_tokens: 2048
    temperature: 0.7
    rpm_limit: 15
  openrouter:
    model: "meta-llama/llama-3.1-8b-instruct:free"
    max_tokens: 2048
    temperature: 0.7
  huggingface:
    model: "meta-llama/Meta-Llama-3.1-8B-Instruct"
    max_tokens: 1024

# ===== Quantization & Export Configuration =====
export:
  output_dir: "outputs"
  adapter_dir: "outputs/lexi_lora_adapters"
  merged_dir: "outputs/lexi_merged_16bit"
  gguf_methods:
    - "q4_k_m"
    - "q5_k_m"
    - "q8_0"
  hf_repo_lora: "your-username/lexi-ai-lora"
  hf_repo_gguf: "your-username/lexi-ai-gguf"

# ===== Evaluation Configuration =====
evaluation:
  judge_provider: "gemini"
  criteria:
    - accuracy
    - reasoning_depth
    - code_quality
    - conciseness
    - helpfulness
  pass_threshold: 7.0  # out of 10

# ===== Deployment Configuration =====
deployment:
  host: "0.0.0.0"
  port: 7860
  workers: 1
  cors_origins:
    - "*"
  rate_limit_rpm: 60
  cache_ttl_seconds: 300
  max_conversation_history: 20

# ===== System Prompt =====
system_prompt: |
  You are LEXI, an elite AI assistant engineered for extreme precision, deep multi-step
  reasoning, and production-grade code generation. You think step-by-step inside <thought>
  tags before delivering flawless, structured answers. You never produce fluff or filler.
  Your responses are concise, technically rigorous, and directly actionable.
